name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The e2e test serves on :3100 and checks canonical URLs, which are fixed at build time.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
      # Real browser against the production build and a local Supabase-compatible mock.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
