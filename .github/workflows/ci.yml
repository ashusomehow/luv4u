name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The e2e test serves on :3100 and checks canonical URLs, which are fixed at build time.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
      - run: npx playwright-core install --with-deps chromium
      # Crawl the production build like a search engine: titles, canonicals, headings, links, headers.
      - name: Site audit
        run: |
          npx next start -p 3100 &
          server=$!
          for i in $(seq 1 30); do curl -sf http://localhost:3100/api/health >/dev/null && break; sleep 1; done
          node scripts/audit-site.mjs http://localhost:3100 http://localhost:3100
          status=$?
          node scripts/audit-pages.mjs http://localhost:3100 http://localhost:3100 || status=1
          kill $server
          exit $status
      # Real browser against the production build and a local Supabase-compatible mock.
      - run: npm run test:e2e
